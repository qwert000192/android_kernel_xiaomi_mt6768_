name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y git make gcc bc libssl-dev bison flex libelf-dev cpio binutils gcc-aarch64-linux-gnu

    - name: Fix dtc build
      run: |
        cd scripts/dtc
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' dtc-lexer.lex.c_shipped
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' dtc-lexer.lex.c
        cd ../..

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make merlin_defconfig
        scripts/config --disable LTO_CLANG
        scripts/config --disable THINLTO
        make -j$(nproc)

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb
