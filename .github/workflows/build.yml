name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y git make bc libssl-dev bison flex libelf-dev cpio binutils device-tree-compiler clang-14 lld-14

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make merlin_defconfig
        scripts/config --disable LTO_CLANG
        scripts/config --disable THINLTO
        scripts/config --disable MTK_TEE_GP_SUPPORT
        scripts/config --disable MICROTRUST_TEE_SUPPORT

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 STRIP=llvm-strip-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 DTC=/usr/bin/dtc

    - name: Create AnyKernel3 zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
        cp arch/arm64/boot/Image.gz-dtb anykernel/
        cd anykernel
        zip -r9 ../Exation-Kernel-merlin-$(date +%Y%m%d-%H%M).zip *
        cd ..

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Exation-Kernel-merlin
        path: |
          arch/arm64/boot/Image.gz-dtb
          *.zip
