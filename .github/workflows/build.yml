name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y git make bc libssl-dev bison flex libelf-dev cpio binutils device-tree-compiler

    - name: Fix dtc (patch shipped files)
      run: |
        cd scripts/dtc
        # Патчим файлы, которые уже есть в репозитории
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' dtc-lexer.lex.c_shipped
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' dtc-lexer.lex.c
        # Отключаем перегенерацию lexer/parser
        touch dtc-lexer.lex.c
        touch dtc-parser.tab.c
        cd ../..

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make merlin_defconfig
        scripts/config --disable LTO_CLANG
        scripts/config --disable THINLTO
        scripts/config --disable MTK_TEE_GP_SUPPORT
        scripts/config --disable MICROTRUST_TEE_SUPPORT
        make -j$(nproc) DTC=/usr/bin/dtc

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb
